services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bankdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Inside Docker, the database's hostname is the service name "postgres".
      # These environment variables override application.properties.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdb
      SPRING_DATASOURCE_USERNAME: bank
      SPRING_DATASOURCE_PASSWORD: bank
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections

volumes:
  pgdata:
